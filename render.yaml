services:
  - type: web
    name: choyjiez-delivery
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: Add GEMINI_API_KEY in Render Dashboard -> Environment to enable Ask Choy AI
      - key: APP_NAME
        value: ChoyJiez DELIVERY
      - key: APP_TAGLINE
        value: All What You Want
      - key: DEFAULT_REGION
        value: Cebu City, Philippines
      - key: DELIVERY_RADIUS_KM
        value: "3"
      - key: DELIVERY_FEE_TIER_1
        value: "25"
      - key: DELIVERY_FEE_TIER_2
        value: "35"
      - key: DELIVERY_FEE_TIER_3
        value: "50"
      - key: VITE_FIREBASE_PROJECT_ID
        value: gen-lang-client-0125944006
      - key: VITE_FIREBASE_DATABASE_ID
        value: ai-studio-choyjiez-fdb2715d-1f62-41f8-bdf4-44891517ae6a
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: gen-lang-client-0125944006.firebaseapp.com
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: gen-lang-client-0125944006.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "119087823167"
      - key: VITE_FIREBASE_APP_ID
        value: "1:119087823167:web:0619539cee5db1d9eebb8a"
